<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" aria-label="PagePulse Favicon">
  <defs>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="#0f0f23" stroke="#00d4ff" stroke-width="1"/>

  <!-- Document Icon (Smaller) -->
  <rect x="8" y="6" width="12" height="16" rx="1" ry="1" fill="url(#pageGradient)" opacity="0.9"/>

  <!-- Document Lines -->
  <line x1="10" y1="10" x2="18" y2="10" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="10" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="10" y1="14" x2="16" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="16" x2="17" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Pulse Wave (Simplified) -->
  <path d="M 4 24 L 6 24 L 8 20 L 10 28 L 12 16 L 14 26 L 16 22 L 18 30 L 20 18 L 22 24 L 24 24 L 26 20 L 28 24"
        fill="none"
        stroke="url(#pulseGradient)"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg>

