<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" aria-label="PagePulse Logo">
  <defs>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Document Icon -->
  <rect x="16" y="8" width="24" height="32" rx="2" ry="2" fill="url(#pageGradient)" stroke="none" opacity="0.9"/>

  <!-- Document Lines -->
  <line x1="20" y1="16" x2="36" y2="16" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="20" x2="36" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="24" x2="32" y2="24" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="28" x2="34" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Pulse Wave -->
  <path d="M 8 48 L 12 48 L 16 40 L 20 56 L 24 32 L 28 52 L 32 44 L 36 60 L 40 36 L 44 48 L 48 48 L 52 40 L 56 48"
        fill="none"
        stroke="url(#pulseGradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Corner Accent -->
  <circle cx="44" cy="12" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="44" cy="12" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>

